[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-downloader"
version = "1.0.0"
description = "Download a Figma file of any size (sm/md/large/xl/xxxxl) in chunks and reconstruct a single full file JSON locally. Stdlib-only Python twin of the Node ESM package in packages/ts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Zero runtime dependencies — Python standard library only.
dependencies = []

[project.scripts]
figma-download = "figma_downloader.cli:main"

[tool.setuptools]
packages = ["figma_downloader"]
